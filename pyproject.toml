[project]
name = "skinlens"
version = "0.1.0"
description = "SkinLens 臉部膚況分析網站 (Flask + MongoDB + Bootstrap/jQuery)"
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.6.0",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pymongo>=4.20.2",
    "python-dotenv>=1.2.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
train = [
    "onnx>=1.23.2",
    "segmentation-models-pytorch>=0.6.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# 訓練用 (選用)：uv sync --extra train。RTX 5090 (Blackwell) 需要 CUDA 12.8 以上的 PyTorch
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
